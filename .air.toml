root = "."
tmp_dir = "air"

[build]
cmd = "go build -o ./air/proxy-guard ./cmd/proxy-guard"
bin = "./air/proxy-guard"
full_bin = "./air/proxy-guard"
include_ext = ["go", "tpl", "tmpl", "html", "json", "yaml", "yml"]
exclude_dir = ["air", "bin", "vendor", ".git", ".idea", ".vscode"]
exclude_file = []
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
